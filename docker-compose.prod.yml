services:
  db:
    image: postgres:16-alpine
    container_name: alentapp-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata-prod:/var/lib/postgresql/data
    networks:
      - alentapp-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    image: alentapp-api:prod
    build:
      context: .
      dockerfile: packages/api/Dockerfile.prod
      target: runtime
    container_name: alentapp-api-prod
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=production
      - PORT=3000
    ports:
      - '3000:3000'
    networks:
      - alentapp-network
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  web:
    image: alentapp-web:prod
    container_name: alentapp-web-prod
    ports:
      - '80:8080'
    networks:
      - alentapp-network
    depends_on:
      - api
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=8M,uid=101,gid=101
      - /var/cache/nginx:size=16M,uid=101,gid=101
      - /var/run:size=4M,uid=101,gid=101
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  alentapp-network:
    driver: bridge

volumes:
  pgdata-prod: