global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'alentapp-api'
    static_configs:
      - targets: ['api:3000']
        labels:
          app: 'alentapp'
          service: 'api'

  - job_name: 'opentelemetry'
    static_configs:
      - targets: ['api:9464']
        labels:
          app: 'alentapp'
          service: 'api-otel'
