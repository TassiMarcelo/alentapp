# Server block del frontend (se copia a /etc/nginx/conf.d/default.conf).
# La imagen nginx-unprivileged ya define el http{} base (pid y temp paths en /tmp),
# por eso acá solo configuramos el server.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para texto/JS/CSS/JSON/SVG (reduce el peso de transferencia).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    # Assets con hash de Vite (/assets/*): cache largo e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: cualquier ruta no resuelta cae en index.html (react-router).
    # El HTML va sin cache para tomar siempre la última versión desplegada.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files $uri $uri/ /index.html;
    }
}
